# Workshop stack: Datadog Agent (Workload Protection / CWS) + Node sample app (IAST via dd-trace).

services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: dd-agent
    env_file:
      - env.agent.lab
    environment:
      - DD_API_KEY
      - DD_HOSTNAME=secure-software-delivery-agent
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_RUNTIME_SECURITY_CONFIG_ENABLED=true
      - DD_RUNTIME_SECURITY_CONFIG_REMOTE_CONFIGURATION_ENABLED=true
      - HOST_ROOT=/host/root
      - DD_CONTAINER_EXCLUDE=name:dd-agent
      - DD_CLOUD_PROVIDER_METADATA=[]
    pid: host
    ports:
      - "8126:8126/tcp"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /:/host/root:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/os-release:/etc/os-release
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    security_opt:
      - apparmor:unconfined

  workshop-app:
    build: .
    image: workshop-secure-software-delivery-app:latest
    container_name: workshop-app
    restart: unless-stopped
    depends_on:
      - datadog-agent
    ports:
      - "80:3000"
    env_file:
      - env.lab
    environment:
      - PORT=3000
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=secure-software-workshop-app
      - DD_ENV=secure-software-delivery
      - DD_VERSION=1.0.0
      - DD_APM_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_APPSEC_ENABLED=true
      - DD_IAST_ENABLED=true
      - DD_REMOTE_CONFIGURATION_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "secure-software-workshop-app"}]'

  # Continuous HTTP traffic against workshop-app (internal network) for App and API Protection.
  # Starts with `docker compose up` by default. restart:on-failure avoids respawning after LOOP=0
  # (clean exit); still recovers if the traffic script crashes with a non-zero status.
  # https://docs.datadoghq.com/security/application_security/
  appsec-traffic:
    image: curlimages/curl:8.5.0
    container_name: appsec-traffic
    depends_on:
      - workshop-app
    environment:
      - BASE_URL=http://workshop-app:3000
      - STARTUP_DELAY=8
      # LOOP=1 (default): run until compose stops. LOOP=0: one sweep then exit.
      - LOOP=${APPSEC_TRAFFIC_LOOP:-1}
      # Seconds after each full endpoint sweep before the next sweep
      - INTERVAL=${APPSEC_TRAFFIC_INTERVAL:-90}
      # Seconds between individual requests within a sweep
      - PAUSE_BETWEEN=${APPSEC_TRAFFIC_PAUSE:-1}
    volumes:
      - ./script/trigger-api-protection-traffic.sh:/run.sh:ro
    entrypoint: ["/bin/sh", "/run.sh"]
    restart: on-failure
